name: refresh profile

# Deliberately not triggered on push: this workflow commits into the same
# repository, and a push trigger would make it retrigger itself.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate statistics panels
        env:
          # Both are passed under their own names so the generator can report
          # which one it used. PROFILE_TOKEN takes priority: it is the one that
          # can carry read:user, which is what makes private contribution
          # counts appear in the contribution calendar. GITHUB_TOKEN remains
          # the fallback and covers public data on its own.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Regenerate ASCII portrait
        run: |
          if [ -f assets/portrait.jpg ]; then
            python -m pip install --disable-pip-version-check --quiet -r requirements.txt
            python scripts/generate_portrait.py
          else
            echo "assets/portrait.jpg not present - keeping the committed portrait as is."
          fi

      # The only asset not generated in this repository. It is allowed to fail
      # without failing the run: the previous card stays committed and the rest
      # of the refresh still goes through.
      - name: Refresh gh-ascii profile card
        continue-on-error: true
        run: python scripts/fetch_ascii_card.py

      # Writes dist/github-snake.svg and dist/github-snake-dark.svg. The query
      # string is read by the action and is not part of the filename; the
      # colours are the same terracotta ramps the contribution grid uses, so
      # the snake matches the rest of the profile rather than GitHub's green.
      # No GIF output is requested.
      #
      # Non-blocking on purpose: the custom statistics matter more than the
      # snake, so an upstream failure here must not stop them being committed.
      # @v3 is a mutable upstream tag.
      - name: Generate contribution snake
        continue-on-error: true
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%23a8562b&color_dots=%23eaeae5,%23e7cec0,%23d5a285,%23bf7a52,%239d5227
            dist/github-snake-dark.svg?color_snake=%23e0885f&color_dots=%23191b1f,%233b2a21,%236d4630,%23a86440,%23e0885f

      - name: Commit generated assets when they changed
        run: |
          TRACKED="generated dist dark_mode.svg light_mode.svg"
          if [ -z "$(git status --porcelain -- $TRACKED)" ]; then
            echo "Generated assets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TRACKED
          git commit -m "chore: refresh generated profile assets"
          git push
