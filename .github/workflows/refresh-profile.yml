name: refresh profile

# Deliberately not triggered on push: this workflow commits into the same
# repository, and a push trigger would make it retrigger itself.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-profile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate statistics panels
        env:
          # The built-in token is enough for public contribution data. Add a
          # fine-grained PROFILE_TOKEN secret (read-only, public data) only if
          # the run fails with a permissions error.
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python scripts/generate_stats.py

      - name: Regenerate ASCII portrait
        run: |
          if [ -f assets/portrait.jpg ]; then
            python -m pip install --disable-pip-version-check --quiet -r requirements.txt
            python scripts/generate_portrait.py
          else
            echo "assets/portrait.jpg not present - keeping the committed portrait as is."
          fi

      - name: Commit generated assets when they changed
        run: |
          if [ -z "$(git status --porcelain -- generated)" ]; then
            echo "Generated assets are unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          git commit -m "chore: refresh generated profile assets"
          git push
